            document.title = villageName + ' - 红色乡村地图 - 红韵智研';

            // Update village name display
            document.getElementById('village-name').textContent = data.icon + ' ' + villageName;

            // Update map marker
            document.getElementById('map-marker').innerHTML = data.icon;

            // Update location info
            document.getElementById('location-info').textContent = data.location;
            document.getElementById('admin-info').textContent = data.admin;
            document.getElementById('red-level').textContent = data.redLevel;

            // Update basic info
            document.getElementById('basic-info').textContent = data.basicInfo;

            // Update history timeline
            const historyContainer = document.getElementById('history-timeline');
            let historyHTML = '';
            data.history.forEach(item => {
                historyHTML += '<div class="history-item">' +
                    '<div class="history-date">' + item.date + '</div>' +
                    '<div class="history-text">' + item.text + '</div>' +
                    '</div>';
            });
            historyContainer.innerHTML = historyHTML;

            // Update revitalization stats
            const statsContainer = document.getElementById('revitalization-stats');
            let statsHTML = '';
            data.stats.forEach(stat => {
                statsHTML += '<div class="stat-box">' +
                    '<div class="stat-box-num">' + stat.num + '</div>' +
                    '<div class="stat-box-label">' + stat.label + '</div>' +
                    '</div>';
            });
            statsContainer.innerHTML = statsHTML;

            // Update related villages
            const relatedContainer = document.getElementById('related-villages');
            let relatedHTML = '';
            const related = allVillages.filter(v => v !== villageName).slice(0, 4);
            related.forEach(name => {
                const vData = villageData[name];
                relatedHTML += '<div class="related-village-card" onclick="window.location.href=\'rural-map.html?q=' + encodeURIComponent(name) + '\'">' +
                    '<div class="related-village-icon">' + vData.icon + '</div>' +
                    '<div class="related-village-name">' + name + '</div>' +
                    '<div class="related-village-location">' + vData.location + '</div>' +
                    '</div>';
            });
            relatedContainer.innerHTML = relatedHTML;
        }

        // Load data on page load
        window.addEventListener('load', loadVillageData);
    </script>
</body>
</html>
